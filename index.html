<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>PackCheck AI - Legal Metrology Compliance Checker</title>
  <meta name="description" content="PackCheck AI - Legal Metrology Compliance Checker for Ministry of Consumer Affairs, Food & Public Distribution" />
  <link rel="shortcut icon" href="assets/icon.png" />
  <link rel="icon" href="assets/icon.png" />
  <link rel="apple-touch-icon" href="assets/icon.png" />

  <!-- Preconnect and Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- PDF.js for Multi-Input PDF Ingestion -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>

  <!-- Canvas-Confetti for successful audits -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Tesseract.js for on-device OCR fallback (works fully offline in the browser) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <!-- Original Bundled Stylesheets -->
  <link rel="stylesheet" href="assets/styles2.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="assets/report.css" />

  <!-- Theme Script (executed immediately to prevent flicker) -->
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('packcheck-theme') || localStorage.getItem('satya-theme') || 'dark';
        document.documentElement.className = savedTheme;
        document.documentElement.setAttribute('data-theme', savedTheme);
      } catch (e) {}
    })();
  </script>
</head>
<body class="font-sans antialiased pb-24 md:pb-0 overflow-x-hidden w-full transition-colors duration-300">
  
  <!-- Splash Screen (shown briefly on initial load like original) -->
  <div id="splash-screen" class="fixed inset-0 z-[9999] bg-[#090a0f] flex flex-col items-center justify-center transition-opacity duration-500 ease-in-out">
    <div class="flex flex-col items-center justify-center -mt-10">
      <div class="w-16 h-16 rounded-2xl bg-blue-600/20 border border-blue-400/30 flex items-center justify-center mb-4 shadow-xl backdrop-blur-md">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-blue-400">
          <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path>
          <path d="m9 12 2 2 4-4"></path>
        </svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2 font-sans">
        PackCheck <span class="text-blue-400">AI</span>
      </h1>
      <p class="text-xs font-mono text-emerald-400 font-semibold tracking-wider mt-1 uppercase">Legal Metrology Compliance</p>
      <div class="flex items-center gap-2 mt-6">
        <div class="w-2.5 h-2.5 rounded-full bg-blue-400 animate-bounce" style="animation-delay:0s"></div>
        <div class="w-2.5 h-2.5 rounded-full bg-indigo-400 animate-bounce" style="animation-delay:0.15s"></div>
        <div class="w-2.5 h-2.5 rounded-full bg-blue-400 animate-bounce" style="animation-delay:0.3s"></div>
      </div>
      <p class="text-white/70 text-xs font-mono tracking-widest uppercase mt-4">Department of Consumer Affairs</p>
    </div>
  </div>

  <!-- Global Starry Space Background (All Pages) -->
  <div class="container stars-container">
    <div id="stars"></div>
    <div id="stars2"></div>
    <div id="stars3"></div>
  </div>

  <!-- Navigation Bar -->
  <header id="main-nav" class="w-full sticky top-0 z-50 bg-[#090a0f]/80 backdrop-blur-xl border-b border-white/10 shadow-[0_4px_30px_rgba(0,0,0,0.5)] transition-colors duration-500">
    <div class="max-w-[1400px] mx-auto px-4 md:px-8 py-3 flex items-center justify-between">
      <!-- Logo & Govt Header -->
      <a href="#/" class="flex items-center gap-3 group text-decoration-none">
        <div class="w-10 h-10 rounded-xl border border-blue-400/30 bg-blue-600/20 flex items-center justify-center shadow-sm relative shrink-0">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-blue-400">
            <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path>
            <path d="m9 12 2 2 4-4"></path>
          </svg>
        </div>
        <div class="flex flex-col justify-center">
          <span class="text-[10px] font-sans tracking-[0.05em] text-white/80 uppercase leading-none mb-1 font-medium">Department of Consumer Affairs • Government of India</span>
          <span class="font-semibold tracking-tight text-[17px] text-white leading-none">PackCheck <span class="font-bold text-blue-400 text-[17px]">AI</span> <span class="font-normal text-white/80 text-[14px]">Legal Metrology</span></span>
        </div>
      </a>

      <!-- Public Nav Links (when on home/login) -->
      <div id="nav-public-links" class="flex items-center gap-4">
        <button id="theme-toggle-btn" aria-label="Toggle theme" class="w-8 h-8 rounded-lg bg-white/10 border border-white/20 flex items-center justify-center text-white shadow-sm hover:bg-white/20 transition-all">
          <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
          <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
        </button>
        <a href="#pipeline" class="text-[13px] font-medium text-white/90 hover:text-white transition-colors hidden sm:block">How it Works</a>
        <a href="#/login" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded-full text-[13px] font-bold shadow-lg shadow-blue-600/30 transition-all hover:scale-105 active:scale-95 border border-blue-400/30">Access Console</a>
      </div>

      <!-- Authenticated Portal Nav Links (when on dashboard/upload/history/settings) -->
      <div id="nav-auth-links" class="hidden items-center gap-6">
        <nav class="hidden md:flex items-center gap-4 text-[13px]">
          <a href="#/dashboard" class="nav-link text-white/75 hover:text-white transition-colors" data-route="/dashboard">Dashboard</a>
          <a href="#/upload" class="nav-link text-white/75 hover:text-white transition-colors font-medium flex items-center gap-1.5" data-route="/upload">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Upload Scan
          </a>
          <a href="#/history" class="nav-link text-white/75 hover:text-white transition-colors" data-route="/history">History</a>
          <a href="#/settings" class="nav-link text-white/75 hover:text-white transition-colors" data-route="/settings">Settings</a>
          <!-- Admin-Only Links -->
          <div id="admin-nav-group" class="hidden items-center gap-4 border-l border-white/20 pl-4">
            <a href="#/rules" class="nav-link text-amber-300/80 hover:text-amber-200 transition-colors text-[12px]" data-route="/rules">Rules Config</a>
            <a href="#/admin" class="nav-link text-white/75 hover:text-white transition-colors text-[12px]" data-route="/admin">Central Command</a>
            <a href="#/admin/reports" class="nav-link text-white/75 hover:text-white transition-colors text-[12px]" data-route="/admin/reports">Grievances</a>
          </div>
        </nav>

        <div class="flex items-center gap-3">
          <button id="auth-theme-toggle-btn" aria-label="Toggle theme" class="w-8 h-8 rounded-full flex items-center justify-center text-white/80 hover:text-white hover:bg-white/10 transition-colors">
            <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
            <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
          </button>
          
          <div class="flex items-center gap-2 pl-2">
            <div class="hidden sm:flex flex-col text-right">
              <span id="user-display-name" class="text-xs font-semibold text-white leading-tight">Field Officer</span>
              <span id="user-display-badge" class="text-[10px] font-mono text-emerald-300/90 leading-tight">officer@gov.in</span>
            </div>
            <button id="logout-btn" class="bg-white/10 hover:bg-white/20 text-white border border-white/20 py-1 px-3 text-[12px] font-medium rounded-full transition-colors">
              Log out
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Dynamic View Container -->
  <main id="app-viewport" class="min-h-[calc(100vh-65px)] relative">
    <!-- Rendered dynamically by app.js -->
  </main>

  <!-- Global Modal for Detailed Scan Report & Notice -->
  <div id="report-modal" class="fixed inset-0 z-[9000] bg-black/75 backdrop-blur-md hidden items-center justify-center p-4 overflow-y-auto">
    <div class="rc-panel bg-surface text-white w-full max-w-4xl rounded-[24px] border border-white/20 shadow-2xl p-6 md:p-8 relative max-h-[92vh] overflow-y-auto">
      <button id="close-modal-btn" class="absolute top-5 right-5 text-white/70 hover:text-white p-1.5 rounded-full hover:bg-white/10 transition-colors z-20">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      <div id="report-modal-content">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none"></div>

  <!-- Main JavaScript App -->
  <script src="app.js"></script>
</body>
</html>
